<script>
// The player lives outside the document, as JavaScript streaming clients can.
let detachedAudio=new Audio();
detachedAudio.preload='none';
detachedAudio.src=document.querySelector('#audio').src;
detachedAudio.loop=true;
document.querySelector('#audio').remove();
const testCovers=['data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEklEQVR4nGPQaNqn0bSPAUIBACUWBaGsNM6xAAAAAElFTkSuQmCC','data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEklEQVR4nGPY4lixxbGCAUIBACjqBbVMzfJBAAAAAElFTkSuQmCC'];
let trackIndex=0;
function setTrack(index){trackIndex=index;navigator.mediaSession.metadata=new MediaMetadata({title:index?'Segunda faixa':'Faixa de teste',artist:'Artista de teste',album:'Álbum de teste',artwork:[{src:testCovers[index],sizes:'2x2',type:'image/png'}]});}
setTrack(0);
navigator.mediaSession.setActionHandler('nexttrack',()=>setTrack(1));
navigator.mediaSession.setActionHandler('previoustrack',()=>setTrack(0));
navigator.mediaSession.setActionHandler('play',()=>{detachedAudio.play();navigator.mediaSession.playbackState='playing'});
navigator.mediaSession.setActionHandler('pause',()=>{detachedAudio.pause();navigator.mediaSession.playbackState='paused'});
function useSessionOnlyPlayer(){
 detachedAudio.pause(); detachedAudio.removeAttribute('src'); detachedAudio.load(); detachedAudio=null;
 navigator.mediaSession.playbackState='paused';
 navigator.mediaSession.setActionHandler('play',()=>navigator.mediaSession.playbackState='playing');
 navigator.mediaSession.setActionHandler('pause',()=>navigator.mediaSession.playbackState='paused');
}
let clicks=0; document.querySelector('#counter').onclick=()=>{clicks++;document.querySelector('#counter').textContent='Clique de teste: '+clicks};
function report(){console.info('AMZML_TEST '+JSON.stringify({dpr:devicePixelRatio,width:innerWidth,height:innerHeight,text:document.querySelector('#entry').value,clicks,scroll:scrollY,quality:document.querySelector('#quality').value}));}
